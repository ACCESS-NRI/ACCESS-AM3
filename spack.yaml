# This is a Spack Environment file!
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-am3]
  - _version: [2026.05.001]
  specs:
  - access-am3
  packages:
    # Direct dependencies
    um:
      require:
      - '@13.1'
      - model="vn13p1-am"
      - jules_ref="f347f33fba58a50d9d03b8ebc1b2c0b37dbaa610"
      - um_ref="594b5e369fa0d74ab7232fa130fbc8a675c4c8ac"
      - ukca_ref="AM3-2026.03.0"
    cable:
      require:
      - '@f5662be320dbea21372971734103f1d172524eff'
      - 'library=access3'

    # Indirect dependencies
    netcdf-c:
      require:
      - '@4.9.2'

    netcdf-fortran:
      require:
      - '@4.5.2'

    fcm:
      require:
      - '@2021.05.0'
      # TODO: Generalize this Gadi-specific variant for spack.yaml
      - 'site=nci-gadi'

    gcom:
      require:
      - '@7.9'

    openmpi:
      require:
      - '@4.1.7'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    cxx:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    fortran:
      require:
      - intel-oneapi-compilers-classic@2021.10.0

    # Specifications that apply to all packages
    all:
      require:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
