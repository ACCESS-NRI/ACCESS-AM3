# This is a Spack Environment file!
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-am3]
  - _version: [2026.05.001]
  specs:
  - access-am3
  packages:
    # Direct dependencies
    um:
      require:
      - '@13.1'
      - model="vn13p1-am"
      - jules_ref="87647b9b9377e9fcc528d45728a184e73a72fba2"
      - um_ref="4367ad344aa28a35e9dc6369d7b7c8508cd0e66a"
      - ukca_ref="AM3-2026.03.0"
    cable:
      require:
      - '@4d6818152b48eb8c0167a78b86bf2dccd7742b87'
      - 'library=access3'

    # Indirect dependencies
    netcdf-c:
      require:
      - '@4.9.2'

    netcdf-fortran:
      require:
      - '@4.5.2'

    fcm:
      require:
      - '@2021.05.0'
      # TODO: Generalize this Gadi-specific variant for spack.yaml
      - 'site=nci-gadi'

    gcom:
      require:
      - '@7.9'

    openmpi:
      require:
      - '@4.1.7'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    cxx:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    fortran:
      require:
      - intel-oneapi-compilers-classic@2021.10.0

    # Specifications that apply to all packages
    all:
      require:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
