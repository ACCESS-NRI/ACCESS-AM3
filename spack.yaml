# This is a Spack Environment file!
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-am3]
  - _version: [2026.06.002]
  specs:
  - access-am3
  packages:
    # Direct dependencies
    um:
      require:
      - '@13.8'
      - model="vn13p1-am"
      - jules_ref="492aae42d33da81c3399eac46e5b114051076631"
      - um_ref="cc4adedbb25f54cc22da93e2e2fd1c045ca6ba34"
      - ukca_ref="AM3-2026.03.0"

    # Indirect dependencies
    netcdf-c:
      require:
      - '@4.9.2'

    netcdf-fortran:
      require:
      - '@4.5.2'

    fcm:
      require:
      - '@2021.05.0'
      # TODO: Generalize this Gadi-specific variant for spack.yaml
      - 'site=nci-gadi'

    gcom:
      require:
      - '@8.4'

    openmpi:
      require:
      - '@4.1.7'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    cxx:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    fortran:
      require:
      - intel-oneapi-compilers-classic@2021.10.0

    # Specifications that apply to all packages
    all:
      require:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
