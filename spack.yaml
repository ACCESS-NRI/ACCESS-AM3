# This is a Spack Environment file!
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-am3]
  - _version: [2026.06.002]
  specs:
  - access-am3
  packages:
    # Direct dependencies
    um:
      require:
      - '@13.1'
      - model="vn13p1-am"
      - jules_ref="512b8bf22acd33cc0b1682a34b3b991ae46ad4c5"
      - um_ref="7cf9fef022ac7c13ef394ae34712cc47d31c507d"
      - ukca_ref="AM3-2026.03.0"
    cable:
      require:
      - '@39fc22033dd4c12062cc47c605b1d736e698535c'
      - 'library=access3'

    # Indirect dependencies
    netcdf-c:
      require:
      - '@4.9.2'

    netcdf-fortran:
      require:
      - '@4.5.2'

    fcm:
      require:
      - '@2021.05.0'
      # TODO: Generalize this Gadi-specific variant for spack.yaml
      - 'site=nci-gadi'

    gcom:
      require:
      - '@7.9'

    openmpi:
      require:
      - '@4.1.7'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    cxx:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    fortran:
      require:
      - intel-oneapi-compilers-classic@2021.10.0

    # Specifications that apply to all packages
    all:
      require:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
