# This is a Spack Environment file!
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  definitions:
  # _name and _version are reserved definitions that inform build-cd deployments, and have no effect otherwise
  - _name: [access-am3]
  - _version: [2026.06.002]
  specs:
  - access-am3
  packages:
    # Direct dependencies
    um:
      require:
      - '@13.1'
      - model="vn13p1-am"
      - jules_ref="b3bffa33be1c8b4dc46a9b9b67b9d100a066d1a2"
      - um_ref="37dda5a5047a4ed52bf92ab695e5660ea4a9b1ab"
      - ukca_ref="AM3-2026.03.0"
    cable:
      require:
      - '@1c1e944f0609ce3f0bf519d6f4ad9864b3f1c0e2'
      - 'library=access3'

    # Indirect dependencies
    netcdf-c:
      require:
      - '@4.9.2'

    netcdf-fortran:
      require:
      - '@4.5.2'

    fcm:
      require:
      - '@2021.05.0'
      # TODO: Generalize this Gadi-specific variant for spack.yaml
      - 'site=nci-gadi'

    gcom:
      require:
      - '@7.9'

    openmpi:
      require:
      - '@4.1.7'
    # Compilers
    c:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    cxx:
      require:
      - intel-oneapi-compilers-classic@2021.10.0
    fortran:
      require:
      - intel-oneapi-compilers-classic@2021.10.0

    # Specifications that apply to all packages
    all:
      require:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
